name: E2E (live site)

# Runs the browser smoke test against production after CI passes on main (Vercel deploys
# the same push in ~2 min), weekly (catches Materials Project API changes), and on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://smse-toolkit-website.vercel.app

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install -r e2e/requirements.txt && python -m playwright install --with-deps chromium
      - name: Wait for the Vercel deploy
        if: github.event_name == 'workflow_run'
        run: sleep 180
      - name: Smoke test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://smse-toolkit-website.vercel.app' }}
        run: python e2e/smoke.py "$BASE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/out/
